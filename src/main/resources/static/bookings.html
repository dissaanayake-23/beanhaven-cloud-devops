<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Manage Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .status-PENDING { color: orange; font-weight: bold; }
        .status-CONFIRMED { color: green; font-weight: bold; }
        .status-CANCELLED { color: red; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
<script>
    if (localStorage.getItem('adminLoggedIn') !== 'true') {
        alert("Unauthorized! Redirecting to login...");
        window.location.href = 'admin-login.html';
    }
</script>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Booking Management</span>
        <a href="admin-panel.html" class="btn btn-outline-light btn-sm">Manage Menu</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Name</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th>
                </tr>
                </thead>
                <tbody id="bookingsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:8080/api/bookings';

    async function loadBookings() {
        const res = await fetch(API);
        const data = await res.json();
        const body = document.getElementById('bookingsBody');
        body.innerHTML = data.map(b => `
                <tr>
                    <td>${b.id}</td>
                    <td>${b.fullName}</td>
                    <td>${b.bookingDate}</td>
                    <td>${b.preferredTime}</td>
                    <td><span class="status-${b.status}">${b.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-success" onclick="updateStatus(${b.id}, 'CONFIRMED')">Check</button>
                        <button class="btn btn-sm btn-danger" onclick="updateStatus(${b.id}, 'CANCELLED')">X</button>
                    </td>
                </tr>
            `).join('');
    }

    async function updateStatus(id, status) {
        await fetch(`${API}/${id}/status?status=${status}`, { method: 'PUT' });
        loadBookings();
    }

    loadBookings();
</script>
</body>
</html>
