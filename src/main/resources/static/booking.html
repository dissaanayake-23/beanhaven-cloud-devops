<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Table | Bean Haven Elite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-black: #080808;
            --espresso-dark: #1a1412;
            --espresso-light: #2c2420;
            --gold: #d4af37;
            --text-muted: #a8a29e;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),
            url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .booking-card {
            background: var(--espresso-dark) !important;
            border-radius: 20px;
            border: 1px solid var(--espresso-light);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .booking-header {
            background: rgba(212, 175, 55, 0.03);
            border-bottom: 1px solid var(--espresso-light);
            padding: 3rem 2rem;
            text-align: center;
        }

        .booking-header h2 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .form-label {
            color: var(--gold);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .form-control, .form-select {
            background-color: var(--espresso-light) !important;
            border: 1px solid #3d3430;
            color: white !important;
            padding: 12px 15px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.1);
            outline: none;
        }

        .form-control::placeholder { color: #665c58; }

        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }

        .btn-book {
            background: var(--gold);
            color: var(--espresso-dark);
            border: none;
            padding: 16px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            transition: 0.4s all;
            margin-top: 1.5rem;
            letter-spacing: 1px;
        }

        .btn-book:hover {
            background: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .back-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            opacity: 0.8;
        }

        .back-link:hover { opacity: 1; color: white; }

        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card booking-card">
                <div class="booking-header">
                    <h2>Reserve Your Table</h2>
                    <p class="text-white-50 mb-0">Experience the finest brews at Bean Haven</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form id="bookingForm">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="fullName" class="form-control" required placeholder="Enter your name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="email" class="form-control" required placeholder="email@example.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="phoneNumber" class="form-control" required placeholder="0712345678" pattern="[0-9]{10}">
                                <div class="error-message" id="phoneError">Phone number must be 10 digits</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Guests</label>
                                <input type="number" id="numberOfGuests" class="form-control" min="1" max="10" value="2" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Booking Date</label>
                                <input type="date" id="bookingDate" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Preferred Time</label>
                                <select id="preferredTime" class="form-select" required>
                                    <option value="" disabled selected>Select Time</option>
                                    <option value="09:00">09:00 AM</option>
                                    <option value="11:00">11:00 AM</option>
                                    <option value="13:00">01:00 PM</option>
                                    <option value="15:00">03:00 PM</option>
                                    <option value="17:00">05:00 PM</option>
                                    <option value="19:00">07:00 PM</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-book w-100" id="submitBtn">
                            <span id="btnText">Confirm My Reservation</span>
                        </button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-4">
                <a href="index.html" class="back-link"><i class="fas fa-long-arrow-alt-left me-2"></i>Back to Home</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Validate phone number
        const phoneNumber = document.getElementById('phoneNumber').value.replace(/\D/g, '');
        if (phoneNumber.length !== 10) {
            document.getElementById('phoneError').style.display = 'block';
            return;
        } else {
            document.getElementById('phoneError').style.display = 'none';
        }

        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        btnText.innerText = "Processing...";
        btn.disabled = true;

        try {
            // Get form values
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const numberOfGuests = parseInt(document.getElementById('numberOfGuests').value, 10);
            const dateInput = document.getElementById('bookingDate').value;
            const timeValue = document.getElementById('preferredTime').value;

            // Validate all fields
            if (!fullName || !email || !phoneNumber || !numberOfGuests || !dateInput || !timeValue) {
                alert("Please fill in all fields");
                btnText.innerText = "Confirm My Reservation";
                btn.disabled = false;
                return;
            }

            // Create the booking data object matching your backend entity
            const bookingData = {
                fullName: fullName,
                email: email,
                phoneNumber: phoneNumber,
                numberOfGuests: numberOfGuests,
                bookingDate: dateInput,  // YYYY-MM-DD format - Spring will convert to LocalDate
                preferredTime: timeValue + ":00", // Add seconds for LocalTime format
                status: "PENDING"
            };

            console.log("Sending to backend:", bookingData);

            // Send to backend
            const response = await fetch('http://localhost:8080/api/bookings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(bookingData)
            });

            if (response.ok) {
                const result = await response.json();
                alert(`Reservation confirmed! Your booking reference: ${result.bookingReference || 'N/A'}\nWe look forward to seeing you!`);
                window.location.href = "index.html";
            } else {
                let errorMessage = "Reservation failed. ";
                try {
                    const errorData = await response.text();
                    console.error("Server error:", errorData);

                    if (response.status === 400) {
                        errorMessage += "Please check your information (phone must be 10 digits, email valid).";
                    } else if (response.status === 500) {
                        errorMessage += "Server error. The time slot might be fully booked.";
                    } else {
                        errorMessage += "Please try again.";
                    }
                } catch {
                    errorMessage += "Unknown error occurred.";
                }
                alert(errorMessage);
            }
        } catch (error) {
            console.error("Connection error:", error);
            alert("Cannot connect to server. Please ensure:\n1. Backend is running on port 8080\n2. MySQL is connected\n3. Database 'coffeeshop' exists");
        } finally {
            btnText.innerText = "Confirm My Reservation";
            btn.disabled = false;
        }
    });

    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('bookingDate').setAttribute('min', today);

    // Phone number validation
    document.getElementById('phoneNumber').addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '').substring(0, 10);
    });
</script>
</body>
</html>
