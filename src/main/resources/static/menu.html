<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Bean Haven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --espresso-dark: #1a1412;
            --espresso-light: #2c2420;
            --gold: #d4af37;
            --cream: #fdfaf5;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)),
            url('https://images.pexels.com/photos/312418/pexels-photo-312418.jpeg');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(26, 20, 18, 0.95) !important;
            padding: 20px 0;
            border-bottom: 1px solid var(--espresso-light);
        }

        .navbar-brand {
            color: var(--gold) !important;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
        }

        .back-btn {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn:hover {
            color: white;
        }

        .menu-header {
            text-align: center;
            padding: 40px 0 30px;
        }

        .menu-header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .menu-header p {
            color: rgba(255,255,255,0.7);
            font-style: italic;
        }

        /* Category Filter Buttons */
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--espresso-light);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--espresso-dark);
            font-weight: 600;
        }

        .coffee-card {
            background: var(--espresso-dark);
            border: 1px solid var(--espresso-light);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            height: 100%;
        }

        .coffee-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .img-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .coffee-card:hover .img-container img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 20px;
        }

        .coffee-name {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 700;
        }

        .coffee-category {
            color: rgba(255,255,255,0.5);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--espresso-light);
            padding: 3px 10px;
            border-radius: 15px;
        }

        .coffee-desc {
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            margin: 10px 0;
            line-height: 1.5;
        }

        .price-tag {
            font-size: 1.3rem;
            color: var(--gold);
            font-weight: 600;
        }

        .btn-order {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-order:hover {
            background: var(--gold);
            color: var(--espresso-dark);
        }

        /* Modal Styles */
        .modal-content {
            background: var(--espresso-dark);
            border: 1px solid var(--gold);
            border-radius: 15px;
        }

        .modal-header {
            border-bottom: 1px solid var(--espresso-light);
            padding: 20px;
        }

        .modal-title {
            color: var(--gold);
            font-family: 'Playfair Display', serif;
        }

        .modal-body {
            padding: 25px;
        }

        .form-label {
            color: var(--gold);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .form-control {
            background: var(--espresso-light);
            border: 1px solid #3d3430;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.2rem rgba(212, 175, 55, 0.1);
        }

        .form-control[readonly] {
            background: #2c2420;
            color: var(--gold);
        }

        .btn-confirm {
            background: var(--gold);
            color: var(--espresso-dark);
            border: none;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-confirm:hover {
            background: white;
            transform: translateY(-2px);
        }

        .alert-message {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .alert-success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">BEAN HAVEN</a>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left me-2"></i>BACK TO HOME</a>
    </div>
</nav>

<div class="container">
    <div class="menu-header">
        <h1>The Art of the Brew</h1>
        <p>Handcrafted with passion, served with soul</p>
    </div>

    <!-- Category Filter Buttons -->
    <div class="category-filter">
        <button class="filter-btn active" onclick="filterMenu('all')">All</button>
        <button class="filter-btn" onclick="filterMenu('Espresso')">Espresso</button>
        <button class="filter-btn" onclick="filterMenu('Cappuccino')">Cappuccino</button>
        <button class="filter-btn" onclick="filterMenu('Latte')">Latte</button>
        <button class="filter-btn" onclick="filterMenu('Iced Coffee')">Iced Coffee</button>
    </div>

    <!-- Menu Grid -->
    <div class="row g-4" id="menuGrid">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-warning" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-white-50">Loading our finest selection...</p>
        </div>
    </div>
</div>

<!-- Order Modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Complete Your Order</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="orderAlert" class="alert-message"></div>

                <form id="orderForm">
                    <div class="mb-3">
                        <label class="form-label">Coffee Name</label>
                        <input type="text" class="form-control" id="modalCoffeeName" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="text" class="form-control" id="modalPrice" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Full Name</label>
                        <input type="text" class="form-control" id="customerName" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="customerPhone" placeholder="07XXXXXXXX" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Delivery Address</label>
                        <textarea class="form-control" id="deliveryAddress" rows="2" placeholder="Your full address" required></textarea>
                    </div>

                    <button type="submit" class="btn-confirm w-100" id="submitOrderBtn">
                        <span id="btnText">Confirm Order</span>
                        <span id="btnSpinner" style="display: none;">
                            <span class="spinner-border spinner-border-sm me-2"></span>Processing...
                        </span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'http://localhost:8080/api/coffees';
    const ORDERS_API = 'http://localhost:8080/api/orders';

    // High-quality coffee images
    const imageMap = {
        "Classic Espresss": "https://images.pexels.com/photos/302899/pexels-photo-302899.jpeg",
        "Cappuccinooo": "https://images.pexels.com/photos/2067628/pexels-photo-2067628.jpeg",
        "Caramel Latte": "https://images.pexels.com/photos/2299028/pexels-photo-2299028.jpeg",
        "Vanilla Latte": "https://images.pexels.com/photos/2299028/pexels-photo-2299028.jpeg",
        "Hazelnut Latte": "https://images.pexels.com/photos/2299028/pexels-photo-2299028.jpeg",
        "Iced Americano": "https://images.pexels.com/photos/312418/pexels-photo-312418.jpeg",
        "Double Espresso": "https://images.pexels.com/photos/374885/pexels-photo-374885.jpeg",
        "default": "https://images.pexels.com/photos/312418/pexels-photo-312418.jpeg"
    };

    let allCoffees = [];

    // Fetch menu items
    async function fetchMenu() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('Failed to fetch');
            const data = await res.json();
            allCoffees = data;
            displayMenu(data);
        } catch (e) {
            console.log("Using fallback data");
            // Fallback data with categories
            allCoffees = [
                { id: 1, name: "Classic Espresss", price: 3.50, category: "Espresso", description: "A rich bold espresso shot" },
                { id: 2, name: "Double Espresso", price: 4.50, category: "Espresso", description: "Double shot of pure espresso" },
                { id: 3, name: "Cappuccinooo", price: 4.25, category: "Cappuccino", description: "Perfect balance of espresso, steamed milk, and foam" },
                { id: 4, name: "Vanilla Cappuccino", price: 4.75, category: "Cappuccino", description: "Cappuccino with vanilla essence" },
                { id: 5, name: "Caramel Latte", price: 5.00, category: "Latte", description: "Smooth latte with sweet caramel syrup" },
                { id: 6, name: "Vanilla Latte", price: 5.00, category: "Latte", description: "Creamy latte with vanilla essence" },
                { id: 7, name: "Hazelnut Latte", price: 5.25, category: "Latte", description: "Rich hazelnut flavored latte" },
                { id: 8, name: "Iced Americano", price: 3.75, category: "Iced Coffee", description: "Chilled espresso with water and ice" },
                { id: 9, name: "Iced Latte", price: 4.50, category: "Iced Coffee", description: "Chilled latte with ice" }
            ];
            displayMenu(allCoffees);
        }
    }

    function displayMenu(coffees) {
        const grid = document.getElementById('menuGrid');

        if (coffees.length === 0) {
            grid.innerHTML = '<div class="col-12 text-center py-5"><p class="text-white-50">No items in this category</p></div>';
            return;
        }

        grid.innerHTML = coffees.map((item) => {
            const displayImg = imageMap[item.name] || imageMap.default;

            return `
            <div class="col-lg-4 col-md-6">
                <div class="coffee-card">
                    <div class="img-container">
                        <img src="${displayImg}" alt="${item.name}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="coffee-name">${item.name}</span>
                            <span class="coffee-category">${item.category || 'Coffee'}</span>
                        </div>
                        <p class="coffee-desc">${item.description || 'Premium artisan coffee'}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="price-tag">$${parseFloat(item.price).toFixed(2)}</span>
                            <button class="btn-order" onclick="openOrderModal(${item.id}, '${item.name}', ${item.price})">ORDER NOW</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        }).join('');
    }

    // Filter menu by category
    window.filterMenu = function(category) {
        // Update active button
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent.toLowerCase() === category.toLowerCase() ||
                (category === 'all' && btn.textContent === 'All')) {
                btn.classList.add('active');
            }
        });

        // Filter coffees
        if (category === 'all') {
            displayMenu(allCoffees);
        } else {
            const filtered = allCoffees.filter(coffee =>
                coffee.category && coffee.category.toLowerCase() === category.toLowerCase()
            );
            displayMenu(filtered);
        }
    };

    // Open order modal
    window.openOrderModal = function(id, name, price) {
        document.getElementById('modalCoffeeName').value = name;
        document.getElementById('modalPrice').value = `$${price.toFixed(2)}`;

        // Clear previous form data
        document.getElementById('customerName').value = '';
        document.getElementById('customerPhone').value = '';
        document.getElementById('deliveryAddress').value = '';

        // Hide any previous alerts
        document.getElementById('orderAlert').style.display = 'none';

        // Store coffee ID for submission
        window.currentCoffeeId = id;
        window.currentPrice = price;

        new bootstrap.Modal(document.getElementById('orderModal')).show();
    };

    // Handle order form submission
    document.getElementById('orderForm').onsubmit = async function(e) {
        e.preventDefault();

        const alertDiv = document.getElementById('orderAlert');
        const submitBtn = document.getElementById('submitOrderBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        // Validate phone number
        const phone = document.getElementById('customerPhone').value;
        if (!/^\d{10}$/.test(phone)) {
            showAlert('Please enter a valid 10-digit phone number', 'error');
            return;
        }

        // Show loading state
        btnText.style.display = 'none';
        btnSpinner.style.display = 'inline-block';
        submitBtn.disabled = true;

        const orderData = {
            coffeeName: document.getElementById('modalCoffeeName').value,
            price: window.currentPrice,
            customerName: document.getElementById('customerName').value,
            customerPhone: phone,
            deliveryAddress: document.getElementById('deliveryAddress').value,
            orderDetails: document.getElementById('modalCoffeeName').value,
            totalPrice: window.currentPrice,
            status: 'PENDING'
        };

        console.log('Sending order:', orderData);

        try {
            const res = await fetch(ORDERS_API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(orderData)
            });

            if (res.ok) {
                showAlert('Order placed successfully! Thank you for choosing Bean Haven.', 'success');
                setTimeout(() => {
                    bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();
                    document.getElementById('orderForm').reset();
                }, 2000);
            } else {
                const error = await res.text();
                throw new Error(error || 'Failed to place order');
            }
        } catch (e) {
            console.error('Order error:', e);

            // Demo mode - show success anyway for testing
            showAlert('Order placed in demo mode! (Backend not connected)', 'success');
            setTimeout(() => {
                bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();
                document.getElementById('orderForm').reset();
            }, 2000);
        } finally {
            // Reset button state
            btnText.style.display = 'inline';
            btnSpinner.style.display = 'none';
            submitBtn.disabled = false;
        }
    };

    function showAlert(message, type) {
        const alertDiv = document.getElementById('orderAlert');
        alertDiv.textContent = message;
        alertDiv.className = `alert-message alert-${type}`;
        alertDiv.style.display = 'block';

        // Auto hide after 3 seconds
        setTimeout(() => {
            alertDiv.style.display = 'none';
        }, 3000);
    }

    // Phone number validation
    document.getElementById('customerPhone').addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '').substring(0, 10);
    });

    // Initialize
    fetchMenu();
</script>
</body>
</html>
