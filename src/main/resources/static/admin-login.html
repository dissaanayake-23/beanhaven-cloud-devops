<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Bean Haven Coffee Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-brown: #8B4513;
      --light-brown: #D2691E;
      --dark-brown: #5D4037;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      max-width: 400px;
      width: 100%;
    }

    .login-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, var(--dark-brown) 0%, var(--primary-brown) 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .login-header h2 {
      margin: 0;
      font-weight: 700;
    }

    .login-header p {
      opacity: 0.9;
      margin: 10px 0 0;
    }

    .login-body {
      padding: 30px;
    }

    .form-control:focus {
      border-color: var(--primary-brown);
      box-shadow: 0 0 0 0.2rem rgba(139, 69, 19, 0.25);
    }

    .btn-login {
      background: linear-gradient(135deg, var(--primary-brown) 0%, var(--light-brown) 100%);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      transition: all 0.3s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
    }

    .alert {
      margin-top: 20px;
    }

    .back-home {
      text-align: center;
      margin-top: 20px;
    }

    .back-home a {
      color: var(--primary-brown);
      text-decoration: none;
    }

    .back-home a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2><i class="fas fa-user-shield"></i> Admin Login</h2>
      <p>Bean Haven Coffee Shop</p>
    </div>

    <div class="login-body">
      <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Enter username" required>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-login">
          <i class="fas fa-sign-in-alt me-2"></i> Login
        </button>
      </form>

      <div class="back-home mt-4">
        <a href="index.html"><i class="fas fa-home me-2"></i>Back to Home Page</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMessage');

    errorDiv.style.display = 'none';

    if (!username || !password) {
      errorDiv.textContent = 'Please enter both username and password';
      errorDiv.style.display = 'block';
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Logging in...';

    setTimeout(() => {
      const validCredentials = (
              (username === 'admin' && password === 'admin123') ||
              (username === 'beanhaven' && password === 'coffee123') ||
              (username === 'administrator' && password === 'password')
      );

      if (validCredentials) {
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminUsername', username);
        window.location.href = 'admin-panel.html';
      } else {
        errorDiv.textContent = 'Invalid username or password';
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    }, 1000);
  });

  document.addEventListener('DOMContentLoaded', function() {
    const isLoggedIn = localStorage.getItem('adminLoggedIn');
    if (isLoggedIn === 'true') {
      window.location.href = 'admin-panel.html';
    }
    document.getElementById('username').value = 'admin';
    document.getElementById('password').value = 'admin123';
  });
</script>
</body>
</html>
