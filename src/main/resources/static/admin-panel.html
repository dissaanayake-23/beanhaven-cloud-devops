<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - Bean Haven Elite</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>

    :root {
      --bg-black: #080808;
      --espresso-dark: #1a1412;
      --espresso-light: #2c2420;
      --gold: #d4af37;
      --text-bright: #ffffff;
      --text-muted: #a0a0a0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-bright);
      display: flex;
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }


    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {
      width: 260px;
      background: #120e0c;
      color: white;
      padding: 25px;
      position: fixed;
      height: 100vh;
      z-index: 1000;
      border-right: 1px solid var(--espresso-light);
    }

    .sidebar h3 {
      color: var(--gold);
    }

    .menu-item {
      padding: 12px;
      margin: 8px 0;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.3s;
      color: rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .menu-item:hover,
    .menu-item.active {
      background: rgba(212,175,55,0.1);
      color: var(--gold);
      border-left: 4px solid var(--gold);
    }


    /* =====================================================
       MAIN CONTENT
       ===================================================== */

    .main-content {
      margin-left: 260px;

      width: calc(100vw - 260px);
      min-width: calc(100vw - 260px);
      min-height: 100vh;

      padding: 40px;

      background:
              linear-gradient(
                      rgba(8, 8, 8, 0.82),
                      rgba(8, 8, 8, 0.82)
              ),
              url('/images/admin-bg.jpg');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }


    /* =====================================================
       OLD STAT CARD
       ===================================================== */

    .card-stat {
      background: var(--espresso-dark);
      border-radius: 15px;
      padding: 25px;
      border: 1px solid var(--espresso-light);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }


    /* =====================================================
       NEW DASHBOARD
       ===================================================== */


    .dashboard-layout {
      display: flex;
      justify-content: center;
      width: 100%;
      min-height: 650px;
    }

    .dashboard-left {
      width: 900px;
      max-width: 100%;
      margin: 0 auto;
      min-width: 0;
    }


    /* TOP 3 CARDS */

    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }

    .dashboard-stat-card {
      background:
              linear-gradient(
                      145deg,
                      #1a1412,
                      #100d0b
              );

      border: 1px solid #352b26;
      border-radius: 16px;

      padding: 22px;

      min-height: 205px;

      box-shadow:
              0 12px 30px rgba(0,0,0,0.4);

      transition: 0.3s;
    }

    .dashboard-stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);

      box-shadow:
              0 16px 35px
              rgba(212,175,55,0.12);
    }

    .stat-icon {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      color: var(--gold);

      background:
              rgba(212,175,55,0.08);

      border:
              1px solid rgba(212,175,55,0.25);

      margin-bottom: 18px;
    }

    .stat-icon i {
      font-size: 1rem;
    }

    .dashboard-stat-card h1 {
      color: white;
      font-size: 2.3rem;
      font-weight: 500;
      margin: 0 0 4px;
    }

    .dashboard-stat-card p {
      color: white;
      margin: 0 0 17px;
      font-size: 0.9rem;
    }

    .dashboard-link {
      background: transparent;
      border: none;
      outline: none;

      padding: 0;

      color: var(--gold);

      font-size: 0.72rem;
      font-weight: 500;

      cursor: pointer;

      transition: 0.25s;
    }

    .dashboard-link:hover {
      color: white;
    }


    /* =====================================================
       DASHBOARD BOTTOM
       ===================================================== */

    .dashboard-bottom {
      display: grid;

      grid-template-columns:
                minmax(240px, 0.9fr)
                minmax(320px, 1.35fr);

      gap: 18px;
    }

    .overview-card,
    .upcoming-card {
      background:
              linear-gradient(
                      145deg,
                      #171210,
                      #0e0c0b
              );

      border: 1px solid #352b26;

      border-radius: 16px;

      padding: 22px;

      min-height: 310px;

      box-shadow:
              0 12px 30px
              rgba(0,0,0,0.35);
    }

    .overview-card h5,
    .upcoming-card h5 {
      color: white;

      font-size: 0.9rem;
      font-weight: 600;
    }


    /* =====================================================
       MONTHLY OVERVIEW
       ===================================================== */

    .overview-content {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 22px;

      margin-top: 38px;
    }

    .donut-chart {
      width: 140px;
      height: 140px;

      flex-shrink: 0;

      border-radius: 50%;

      background:
              conic-gradient(
                      var(--gold) 0deg 250deg,
                      #c17a3a 250deg 320deg,
                      #d94c4c 320deg 360deg
              );

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .donut-chart::before {
      content: "";

      position: absolute;

      width: 88px;
      height: 88px;

      border-radius: 50%;

      background: #0e0c0b;
    }

    .donut-center {
      position: relative;
      z-index: 2;

      text-align: center;
    }

    .donut-center small {
      display: block;

      color: var(--text-muted);

      font-size: 0.62rem;

      margin-bottom: 2px;
    }

    .donut-center strong {
      color: white;

      font-size: 1.5rem;
    }

    .overview-legend {
      min-width: 120px;
    }

    .overview-legend div {
      color: #c4bfbc;

      font-size: 0.68rem;

      margin-bottom: 14px;
    }

    .overview-legend strong {
      color: white;

      float: right;

      margin-left: 10px;
    }

    .legend-dot {
      display: inline-block;

      width: 8px;
      height: 8px;

      border-radius: 2px;

      margin-right: 7px;
    }

    .legend-dot.completed {
      background: var(--gold);
    }

    .legend-dot.pending {
      background: #c17a3a;
    }

    .legend-dot.cancelled {
      background: #d94c4c;
    }


    /* =====================================================
       UPCOMING RESERVATIONS
       ===================================================== */

    #dashboardReservations {
      margin-top: 8px;
    }

    .dashboard-reservation-item {
      padding: 12px 0;

      border-bottom:
              1px solid #2d2521;
    }

    .dashboard-reservation-item:last-child {
      border-bottom: none;
    }

    .dashboard-reservation-name {
      color: white;

      font-size: 0.82rem;
      font-weight: 600;

      margin-bottom: 6px;
    }

    .dashboard-reservation-meta {
      display: flex;

      gap: 12px;

      flex-wrap: wrap;

      color: var(--text-muted);

      font-size: 0.65rem;
    }

    .dashboard-reservation-meta i {
      color: var(--gold);

      margin-right: 4px;
    }


    /* =====================================================
       RIGHT SIDE COFFEE IMAGE
       ===================================================== */

    .dashboard-image {
      position: relative;

      min-height: 650px;

      overflow: hidden;

      border-radius: 18px;

      border: 1px solid #352b26;

      background-image:
              linear-gradient(
                      rgba(0,0,0,0.15),
                      rgba(0,0,0,0.45)
              ),
              url(
              'https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1200&q=85'
              );

      background-size: cover;

      background-position: center;

      box-shadow:
              0 18px 40px
              rgba(0,0,0,0.45);
    }

    .image-dark-overlay {
      position: absolute;

      inset: 0;

      background:
              linear-gradient(
                      90deg,
                      rgba(8,8,8,0.65),
                      rgba(8,8,8,0.05)
              );
    }

    .coffee-quote {
      position: absolute;

      top: 110px;
      left: 50%;

      transform:
              translateX(-50%)
              rotate(-5deg);

      width: 90%;

      text-align: center;

      color: #f1cf7a;

      font-family:
              'Playfair Display',
              serif;

      font-size: 2rem;

      font-style: italic;

      line-height: 1.35;

      text-shadow:
              0 0 20px
              rgba(212,175,55,0.55);
    }


    /* =====================================================
       TABLE
       ===================================================== */

    .table {
      border-collapse: separate !important;
      border-spacing: 0 12px !important;
      background: transparent !important;
      width: 100%;
    }

    .table thead th {
      background: transparent !important;
      color: var(--gold) !important;
      border: none !important;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1.2px;
      padding: 10px 20px;
    }

    .table tbody tr {
      background-color: var(--espresso-dark) !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }

    .table tbody tr:hover {
      transform: scale(1.01);
      background-color: #231a17 !important;
    }

    .table td {
      background: transparent !important;
      border-top: 1px solid var(--espresso-light) !important;
      border-bottom: 1px solid var(--espresso-light) !important;
      padding: 20px !important;
      color: white !important;
      vertical-align: middle;
    }

    .table td:first-child {
      border-left: 1px solid var(--espresso-light) !important;
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }

    .table td:last-child {
      border-right: 1px solid var(--espresso-light) !important;
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
    }


    /* =====================================================
       STATUS BADGES
       ===================================================== */

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .status-pending {
      background: rgba(212,175,55,0.1);
      color: var(--gold);
      border-color: var(--gold);
    }

    .status-confirmed {
      background: rgba(40,167,69,0.1);
      color: #28a745;
      border-color: #28a745;
    }

    .status-cancelled {
      background: rgba(220,53,69,0.1);
      color: #dc3545;
      border-color: #dc3545;
    }


    /* =====================================================
       ACTION BUTTONS
       ===================================================== */

    .action-btn {
      background: transparent;
      border: 1px solid var(--espresso-light);
      color: white;

      width: 35px;
      height: 35px;

      border-radius: 50%;

      transition: 0.3s;
    }

    .action-btn:hover {
      background: var(--gold);
      color: black;
      border-color: var(--gold);
    }

    .delete-btn:hover {
      background: #dc3545;
      border-color: #dc3545;
    }


    /* =====================================================
       MODAL + FORMS
       ===================================================== */

    .modal-content {
      background: var(--espresso-dark);
      border: 1px solid var(--gold);
      border-radius: 15px;
    }

    .modal-header {
      border-bottom: 1px solid var(--espresso-light);
    }

    .form-control,
    .form-select {
      background: var(--bg-black) !important;
      border: 1px solid var(--espresso-light) !important;
      color: white !important;
    }

    .form-control::placeholder {
      color: #777;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--gold) !important;

      box-shadow:
              0 0 0 0.15rem
              rgba(212,175,55,0.15);
    }

    .coffee-image-small {
      width: 65px;
      height: 50px;

      object-fit: cover;

      border-radius: 8px;

      border:
              1px solid
              var(--espresso-light);
    }


    /* =====================================================
       ACCESS DENIED
       ===================================================== */

    .unauthorized-container {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: flex-start;
      align-items: center;

      padding-left: 120px;

      background:
              linear-gradient(
                      rgba(0, 0, 0, 0.65),
                      rgba(0, 0, 0, 0.65)
              ),
              url('/images/admin-panel-bg.jpg');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      z-index: 9999;
    }

    .unauthorized-card {
      background: var(--espresso-dark);

      border:
              1px solid
              var(--espresso-light);

      padding: 40px;

      text-align: center;

      max-width: 400px;

      border-radius: 15px;

      box-shadow:
              0 10px 30px
              rgba(0,0,0,0.5);
    }

    .unauthorized-card i {
      font-size: 4rem;

      color: #dc3545;

      margin-bottom: 20px;
    }

    .unauthorized-card h2 {
      color: var(--gold);

      margin-bottom: 15px;
    }

    .unauthorized-card p {
      color: var(--text-muted);

      margin-bottom: 25px;
    }

    .unauthorized-card .btn {
      background: var(--gold);

      color: var(--espresso-dark);

      border: none;

      padding: 10px 30px;

      text-decoration: none;

      display: inline-block;

      border-radius: 8px;

      font-weight: 600;
    }

    .unauthorized-card .btn:hover {
      background: white;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 1250px) {

      .dashboard-layout {
        grid-template-columns: 1fr;
      }

      .dashboard-image {
        min-height: 350px;
      }

    }

    @media (max-width: 900px) {

      .dashboard-stats {
        grid-template-columns: 1fr;
      }

      .dashboard-bottom {
        grid-template-columns: 1fr;
      }

      .overview-content {
        flex-wrap: wrap;
      }

    }


    /* =====================================================
       ANIMATION
       ===================================================== */

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>

</head>

<div id="app"></div>

  // =========================================================

  if (window.location.protocol === "file:") {

            "http://localhost:8082/admin-panel.html";

            sessionStorage.getItem("adminLoggedIn");

    const appDiv =
            document.getElementById("app");


    if (
            isLoggedIn !== "true" ||
            adminRole !== "ADMIN"

      appDiv.innerHTML = `

        <div class="unauthorized-container">

          <div class="unauthorized-card">

            <i class="fas fa-lock"></i>

              Access Denied
            </h2>

            <p>
              You must be logged in as an administrator
              to access the admin panel.
            </p>

            <a
                    href="admin-login.html"
                    class="btn">

              Go to Login

            </a>

          </div>

        </div>
      `;

      return;

    loadAdminContent();

  })();

  function showSection(
          sectionId,
          element
  ) {

    document
            .querySelectorAll(
                    ".section"
            )
            .forEach(
                    section =>
                            section
                                    .classList
                                    .remove(
                                            "active"
                                    )
            );


    document
            .querySelectorAll(
                    ".menu-item"
            )
            .forEach(
                    menu =>
                            menu
                                    .classList
                                    .remove(
                                            "active"
                                    )
            );


    const section =
            document.getElementById(
                    sectionId
            );


    if (section) {

      section
              .classList
              .add(
                      "active"
              );
    }


    if (element) {

      element
              .classList
              .add(
                      "active"
              );
    }


    if (
            sectionId ===
            "bookings-section"
    ) {

      loadBookings();
    }


    if (
            sectionId ===
            "coffees-section"
    ) {

      loadCoffees();
    }


    if (
            sectionId ===
            "orders-section"
    ) {

      loadOrders();
    }


    if (
            sectionId ===
            "dashboard"
    ) {

      updateStats();
    }
  }

  // =========================================================

  document.addEventListener(
          "change",
          function (event) {

            if (
                    !event.target ||
                    event.target.id !== "cImage"
            ) {

              return;
            }


            const file =
                    event.target.files[0];


            const previewContainer =
                    document.getElementById(
                            "imagePreviewContainer"
                    );


            const preview =
                    document.getElementById(
                            "imagePreview"
                    );


            if (!file) {

              previewContainer.style.display =
                      "none";

              return;
            }


            if (
                    file.size >
                    5 * 1024 * 1024
            ) {

              alert(
                      "Image must be smaller than 5 MB."
              );

              event.target.value = "";

              previewContainer.style.display =
                      "none";

              return;
            }


            preview.src =
                    URL.createObjectURL(
                            file
                    );


            previewContainer.style.display =
                    "block";
          }
  );


  // =========================================================
  // ADD COFFEE WITH IMAGE
  // =========================================================

  document.addEventListener(
          "submit",
          async function (event) {

            if (
                    !event.target ||
                    event.target.id !==
                    "coffeeForm"
            ) {

              return;
            }


            event.preventDefault();


            const errorBox =
                    document.getElementById(
                            "coffeeFormError"
                    );


            const successBox =
                    document.getElementById(
                            "coffeeFormSuccess"
                    );


            const saveButton =
                    document.getElementById(
                            "saveCoffeeButton"
                    );


            errorBox.style.display =
                    "none";


            successBox.style.display =
                    "none";


            const name =
                    document
                            .getElementById(
                                    "cName"
                            )
                            .value
                            .trim();


            const description =
                    document
                            .getElementById(
                                    "cDescription"
                            )
                            .value
                            .trim();


            const price =
                    parseFloat(
                            document
                                    .getElementById(
                                            "cPrice"
                                    )
                                    .value
                    );


            const category =
                    document
                            .getElementById(
                                    "cCategory"
                            )
                            .value;


            const imageInput =
                    document.getElementById(
                            "cImage"
                    );


            const imageFile =
                    imageInput.files[0];


            if (!name) {

              errorBox.textContent =
                      "Coffee name is required.";

              errorBox.style.display =
                      "block";

              return;
            }


            if (
                    Number.isNaN(price) ||
                    price <= 0
            ) {

              errorBox.textContent =
                      "Please enter a valid price.";

              errorBox.style.display =
                      "block";

              return;
            }


            if (!imageFile) {

              errorBox.textContent =
                      "Please select a coffee image.";

              errorBox.style.display =
                      "block";

              return;
            }


            try {

              saveButton.disabled =
                      true;


              saveButton.innerHTML =
                      '<i class="fas fa-spinner fa-spin me-2"></i>' +
                      'Uploading Image...';


              // =============================================
              // STEP 1 - UPLOAD IMAGE
              // =============================================

              const formData =
                      new FormData();


              formData.append(
                      "image",
                      imageFile
              );


              const uploadResponse =
                      await fetch(
                              `${API_BASE}/coffees/upload-image`,
                              {

                                method:
                                        "POST",

                                body:
                                formData
                              }
                      );


              let uploadData;


              try {

                uploadData =
                        await uploadResponse.json();

              } catch (error) {

                throw new Error(
                        "Invalid image upload response."
                );
              }


              if (!uploadResponse.ok) {

                throw new Error(
                        uploadData.error ||
                        "Image upload failed."
                );
              }


              const imageUrl =
                      uploadData.imageUrl;


              if (!imageUrl) {

                throw new Error(
                        "Image URL was not returned."
                );
              }


              // =============================================
              // STEP 2 - SAVE COFFEE
              // =============================================

              saveButton.innerHTML =
                      '<i class="fas fa-spinner fa-spin me-2"></i>' +
                      'Saving Coffee...';


              const coffee = {

                name:
                name,

                description:
                description,

                price:
                price,

                category:
                category,

                imageUrl:
                imageUrl,

                available:
                        true
              };


              const coffeeResponse =
                      await fetch(
                              `${API_BASE}/coffees`,
                              {

                                method:
                                        "POST",

                                headers: {

                                  "Content-Type":
                                          "application/json"
                                },

                                body:
                                        JSON.stringify(
                                                coffee
                                        )
                              }
                      );


              let savedCoffee;


              try {

                savedCoffee =
                        await coffeeResponse.json();

              } catch (error) {

                throw new Error(
                        "Invalid coffee save response."
                );
              }


              if (!coffeeResponse.ok) {

                throw new Error(
                        savedCoffee.error ||
                        "Unable to save coffee."
                );
              }


              // =============================================
              // SUCCESS
              // =============================================

              successBox.textContent =
                      "Coffee added successfully!";


              successBox.style.display =
                      "block";


              document
                      .getElementById(
                              "coffeeForm"
                      )
                      .reset();


              document
                      .getElementById(
                              "imagePreviewContainer"
                      )
                      .style.display =
                      "none";


              await loadCoffees();


              await updateStats();


              setTimeout(
                      function () {

                        const modalElement =
                                document.getElementById(
                                        "addCoffeeModal"
                                );


                        const modal =
                                bootstrap.Modal
                                        .getInstance(
                                                modalElement
                                        );


                        if (modal) {

                          modal.hide();
                        }


                        successBox.style.display =
                                "none";

                      },
                      1000
              );


            } catch (error) {

              console.error(
                      "Add coffee error:",
                      error
              );


              errorBox.textContent =
                      error.message ||
                      "Unable to add coffee.";


              errorBox.style.display =
                      "block";


            } finally {

              saveButton.disabled =
                      false;

  // =========================================================
  // UPDATE ORDER STATUS
  // =========================================================

  async function updateOrderStatus(
          id,
          orderType,
          currentStatus
  ) {

    let nextStatus = null;


    // TAKEAWAY FLOW
    if (orderType === "TAKEAWAY") {

      if (currentStatus === "PENDING") {
        nextStatus = "PREPARING";

      } else if (currentStatus === "PREPARING") {
        nextStatus = "READY";

      } else if (currentStatus === "READY") {

        alert(
                "This takeaway order is already ready."
        );

        return;
      }
    }


    // DELIVERY FLOW
    else {

      if (currentStatus === "PENDING") {
        nextStatus = "PREPARING";

      } else if (currentStatus === "PREPARING") {
        nextStatus = "OUT_FOR_DELIVERY";

      } else if (currentStatus === "OUT_FOR_DELIVERY") {
        nextStatus = "DELIVERED";

      } else if (currentStatus === "DELIVERED") {

        alert(
                "This delivery order is already delivered."
        );

        return;
      }
    }


    if (!nextStatus) {

      alert(
              "Unable to change this order status."
      );

      return;
    }


    try {

      const response =
              await fetch(
                      `${API_BASE}/orders/${id}/status?status=${nextStatus}`,
                      {
                        method: "PATCH"
                      }
              );


      if (!response.ok) {

        throw new Error(
                "Unable to update order status"
        );
      }


      alert(
              `Order status changed to ${nextStatus}`
      );


      // Reload table
      await loadOrders();


      // Reload dashboard count
      await updateStats();


    } catch (error) {

      console.error(
              "Order status update error:",
              error
      );


      alert(
              "Unable to update order status."
      );
    }
  }

                          );
                        }

                        imageUrl =

<!-- =========================================
     DASHBOARD MONTHLY + UPCOMING RESERVATIONS
     ========================================= -->
<script>
  async function loadDashboardReservations() {

    const container = document.getElementById("dashboardReservations");

    try {

      const response = await fetch("/api/bookings");

      if (!response.ok) {
        throw new Error("Failed to load bookings");
      }

      const bookings = await response.json();

      console.log("Dashboard bookings:", bookings);

      // ==========================================
      // MONTHLY OVERVIEW
      // ==========================================

      const now = new Date();

      const monthlyBookings = bookings.filter(booking => {

        if (!booking.bookingDate) return false;

        const date = new Date(booking.bookingDate + "T00:00:00");

        return (
                date.getMonth() === now.getMonth() &&
                date.getFullYear() === now.getFullYear()
        );
      });


      const total = monthlyBookings.length;

      const confirmed = monthlyBookings.filter(
              booking =>
                      booking.status &&
                      booking.status.toUpperCase() === "CONFIRMED"
      ).length;

      const pending = monthlyBookings.filter(
              booking =>
                      booking.status &&
                      booking.status.toUpperCase() === "PENDING"
      ).length;

      const cancelled = monthlyBookings.filter(
              booking =>
                      booking.status &&
                      booking.status.toUpperCase() === "CANCELLED"
      ).length;


      // Calculate percentages

      const confirmedPercent =
              total === 0 ? 0 : Math.round((confirmed / total) * 100);

      const pendingPercent =
              total === 0 ? 0 : Math.round((pending / total) * 100);

      const cancelledPercent =
              total === 0 ? 0 : Math.round((cancelled / total) * 100);


      // Update dashboard

      const donutTotal = document.getElementById("overviewTotal");
      if (donutTotal) {
        donutTotal.textContent = total;
      }


      const confirmedPercentElement =
              document.getElementById("completedPercent");

      if (confirmedPercentElement) {
        confirmedPercentElement.textContent =
                confirmedPercent + "%";
      }


      const pendingPercentElement =
              document.getElementById("pendingPercent");

      if (pendingPercentElement) {
        pendingPercentElement.textContent =
                pendingPercent + "%";
      }


      const cancelledPercentElement =
              document.getElementById("cancelledPercent");

      if (cancelledPercentElement) {
        cancelledPercentElement.textContent =
                cancelledPercent + "%";
      }


      // ==========================================
      // UPDATE DONUT CHART
      // ==========================================

      const donut = document.querySelector(".donut-chart");

      if (donut && total > 0) {

        const confirmedEnd =
                confirmedPercent * 3.6;

        const pendingEnd =
                confirmedEnd +
                (pendingPercent * 3.6);

        donut.style.background = `
                conic-gradient(
                    #d4af37 0deg ${confirmedEnd}deg,
                    #c17a3a ${confirmedEnd}deg ${pendingEnd}deg,
                    #d94c4c ${pendingEnd}deg 360deg
                )
            `;
      }


      // ==========================================
      // UPCOMING RESERVATIONS
      // ==========================================

      if (!container) {
        console.error(
                "dashboardReservations element not found"
        );
        return;
      }


      const today = new Date();

      today.setHours(0, 0, 0, 0);


      const upcoming = bookings
              .filter(booking => {

                if (!booking.bookingDate) {
                  return false;
                }

                if (
                        booking.status &&
                        booking.status.toUpperCase() === "CANCELLED"
                ) {
                  return false;
                }

                const bookingDate =
                        new Date(
                                booking.bookingDate +
                                "T00:00:00"
                        );

                return bookingDate >= today;

              })
              .sort((a, b) => {

                const first =
                        new Date(
                                a.bookingDate +
                                "T" +
                                (a.preferredTime || "00:00")
                        );

                const second =
                        new Date(
                                b.bookingDate +
                                "T" +
                                (b.preferredTime || "00:00")
                        );

                return first - second;

              })
              .slice(0, 5);


      // Nothing upcoming

      if (upcoming.length === 0) {

        container.innerHTML = `
                <div style="
                    color:#888;
                    padding-top:20px;
                    font-size:14px;
                ">
                    No upcoming reservations
                </div>
            `;

        return;
      }


      // Display bookings

      container.innerHTML = upcoming.map(booking => {

        const date =
                new Date(
                        booking.bookingDate +
                        "T00:00:00"
                );

        const formattedDate =
                date.toLocaleDateString(
                        "en-US",
                        {
                          day: "2-digit",
                          month: "short",
                          year: "numeric"
                        }
                );


        let time = booking.preferredTime || "";

        if (time.length >= 5) {

          const parts = time.split(":");

          let hour = parseInt(parts[0]);
          const minute = parts[1];

          const ampm =
                  hour >= 12 ? "PM" : "AM";

          hour = hour % 12 || 12;

          time =
                  `${hour}:${minute} ${ampm}`;
        }


        return `
                <div class="dashboard-reservation-item">

                    <div class="dashboard-reservation-name">
                        ${booking.fullName || "Guest"}
                    </div>

                    <div class="dashboard-reservation-meta">

                        <span>
                            <i class="fa-regular fa-calendar"></i>
                            ${formattedDate}
                        </span>

                        <span>
                            <i class="fa-regular fa-clock"></i>
                            ${time}
                        </span>

                        <span>
                            <i class="fa-solid fa-user-group"></i>
                            ${booking.numberOfGuests || 0} Guests
                        </span>

                    </div>

                </div>
            `;

      }).join("");


    } catch (error) {

      console.error(
              "Dashboard reservation error:",
              error
      );

      if (container) {

        container.innerHTML = `
                <div style="
                    color:#dc3545;
                    padding-top:20px;
                    font-size:13px;
                ">
                    Could not load reservations
                </div>
            `;
      }
    }
  }


  // Load when page opens
  document.addEventListener(
          "DOMContentLoaded",
          loadDashboardReservations
  );
  /* LOAD DASHBOARD DATA */
  loadDashboardReservations();

</script>
