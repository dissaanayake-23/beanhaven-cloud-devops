apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecommerce-backend

  template:
    metadata:
      labels:
        app: ecommerce-backend

    spec:
      containers:
        - name: ecommerce-backend
          image: ghcr.io/dissaanayake-23/beanhaven-cloud-devops:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8081

          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_URL

            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: DB_PASSWORD

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: ADMIN_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-backend

spec:
  selector:
    app: ecommerce-backend

  ports:
    - port: 8081
      targetPort: 8081

  type: ClusterIP